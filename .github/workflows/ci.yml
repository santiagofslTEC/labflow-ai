name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    # next.config.ts refuses a production build without API_URL, and both `next typegen`
    # (in typecheck) and `next build` load it; any URL works here.
    env:
      API_URL: http://localhost:8000
      # Inlined by `pnpm build`, which the Playwright suite then serves: values that
      # are never called but turn the account forms on (spec 0014).
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The phone suite (spec 0010, AC-13) runs against that build, with the API stubbed.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      # The committed contract must match the Pydantic models (run `make openapi` to refresh).
      - name: OpenAPI contract is current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json
