[project]
name = "labflow-api"
version = "0.1.0"
description = "LabFlow AI backend: data, AI calls, and every secret key"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlmodel>=0.0.45",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, B bugbear, UP pyupgrade, SIM simplify,
# BLE no blind except (E722 covers bare), ANN full type hints, RUF ruff specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "BLE", "ANN", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["app", "scripts"]
