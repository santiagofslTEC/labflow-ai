[project]
name = "labflow-api"
version = "0.1.0"
description = "LabFlow AI backend: data, AI calls, and every secret key"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "ollama>=0.6.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf[crypto]>=6.21.4",
    "sqlmodel>=0.0.45",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "certifi>=2026.10.23",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "websockets>=17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, B bugbear, UP pyupgrade, SIM simplify,
# BLE no blind except (E722 covers bare), ANN full type hints, RUF ruff specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "BLE", "ANN", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls the real AI providers; run with `uv run pytest -m live` (needs keys)"]
